<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wdrożenia - Prezenty</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#0d1117">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
    <link rel="apple-touch-icon" href="icon-180.png?v=4">
    <link href="deploy-page.css?v=1" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <main class="term" aria-labelledby="termTitle">
        <header class="term-bar">
            <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <h1 class="term-title" id="termTitle">prezenty@oracle: ~/wdrożenia</h1>
            <a class="term-back" href="/">wróć</a>
        </header>
        <section class="term-body">
            <p class="term-cmd"><span class="term-prompt" aria-hidden="true">$</span> status</p>
            <p class="term-status" id="statusLine" role="status" aria-live="polite">Ładowanie…</p>
            <dl class="term-facts" id="facts"></dl>
            <p class="term-cmd"><span class="term-prompt" aria-hidden="true">$</span> tail deploy.log</p>
            <div class="term-log" id="log" role="log" aria-label="Dziennik wdrożeń" tabindex="0"></div>
            <p class="term-cmd"><span class="term-prompt" aria-hidden="true">$</span><span class="term-cursor" aria-hidden="true"></span></p>
        </section>
    </main>
    <script src="deploy-page.js?v=1"></script>
</body>
</html>
