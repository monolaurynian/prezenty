<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezenty - Logowanie</title>

    <!-- Cache Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#F44336">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Życzenia Prezentowe">
    <meta name="description" content="Aplikacja do zarządzania pomysłami na prezenty świąteczne">

    <!-- Favicon and App Icons -->    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=1">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
    <link rel="apple-touch-icon" href="icon-180.png?v=4">
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.deduped.min.css">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <!-- Snowflakes inside the card -->
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>
            <div class="snowflake">❆</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>
            <div class="snowflake">❆</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>
            <div class="snowflake">❆</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>
            <div class="snowflake">❆</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>
            <div class="snowflake">❆</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>
            <div class="snowflake">❆</div>
            <div class="snowflake">❄</div>
            <div class="snowflake">❅</div>

            <div class="login-header content-transition" id="loginHeader">
                <h4 class="mt-2"
                    style="margin-bottom: 1rem; margin-top: 0.5rem; color: white !important; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 4px 16px rgba(0, 0, 0, 0.8);">
                    Życzenia Prezentowe</h4>
            </div>
            <div class="login-body content-transition" id="loginBody">

                <form id="loginForm" style="margin-top: 1rem; margin-left: 2rem; margin-right: 2rem;">
                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" placeholder="Nazwa użytkownika" required>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" placeholder="Hasło" required>
                    </div>

                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt me-2"></i>Zaloguj się
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="#" class="btn-link" style="transition: all 0.3s ease;" onclick="toggleToRegister(event)">
                        <i class="fas fa-user-plus me-1"></i>Nie masz konta? Zarejestruj się
                    </a>
                </div>

                <div class="text-center mt-2">
                    <a href="/formularz" class="btn-link" style="transition: all 0.3s ease;">
                        <i class="fas fa-clipboard-list me-1"></i>Dodaj życzenie bez logowania
                    </a>
                </div>

                <!-- PWA Install Button -->
                <div class="text-center mt-4" id="installButtonContainer" style="display: none;">
                    <button id="installButton" class="btn btn-outline-light btn-sm"
                        style="backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.3s ease;">
                        <i class="fas fa-download me-2"></i>Zainstaluj aplikację
                    </button>
                </div>

                <div id="loginMessage" class="alert mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Cold-start overlay: shown when the server is waking up from sleep -->
    <div id="coldStartOverlay" style="display: none; position: fixed; inset: 0; z-index: 10000;
        background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%);
        color: white; text-align: center; padding: 24px;
        flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-size: 64px; margin-bottom: 16px;">🎄</div>
        <h4 style="margin-bottom: 12px;">Budzimy serwer...</h4>
        <p style="color: rgba(255,255,255,0.8); max-width: 340px; line-height: 1.5;">
            Aplikacja drzemała, żeby oszczędzać energię jak Mikołaj przed Wigilią.
            Za chwilę będzie gotowa!
        </p>
        <div class="spinner-border text-light mt-2" role="status">
            <span class="visually-hidden">Ładowanie...</span>
        </div>
        <p id="coldStartTimer" style="margin-top: 16px; font-size: 14px; color: rgba(255,255,255,0.6);"></p>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- PWA Install Script -->
    <script src="index-page-pwa.js?v=1"></script>

    <script src="index-page.js?v=1"></script>

</body>

</html>
